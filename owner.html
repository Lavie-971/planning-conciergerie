<script>

const SUPABASE_KEY='sb_publishable_18iXDJZ_uUphC2DeZA60wQ__cZTIiC_';

const token=new URLSearchParams(location.search).get('token');
const message=document.getElementById('message');
const dashboard=document.getElementById('dashboard');
const yearSelect=document.getElementById('year');
const currentYear=new Date().getFullYear();
const months=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

for(let y=currentYear-2;y<=currentYear+2;y++){
  const option=document.createElement('option');
  option.value=y;
  option.textContent=y;
  if(y===currentYear)option.selected=true;
  yearSelect.appendChild(option);
}

function addText(parent,tag,value,className){
  const el=document.createElement(tag);
  el.textContent=value==null?'':String(value);
  if(className)el.className=className;
  parent.appendChild(el);
  return el;
}

function money(value){
  return Number(value||0).toLocaleString('fr-FR',{
    style:'currency',currency:'EUR'
  });
}

function formatDate(value){
  if(!value)return '—';
  const d=new Date(value+'T12:00:00');
  return isNaN(d.getTime())?value:d.toLocaleDateString('fr-FR');
}

function dateValue(value){
  if(!value)return NaN;
  return Date.parse(value+'T00:00:00Z');
}

function getNights(booking){
  const start=dateValue(booking.checkin);
  const end=dateValue(booking.checkout);
  if(!Number.isFinite(start)||!Number.isFinite(end))return 0;
  return Math.max(0,Math.round((end-start)/86400000));
}

function getCommission(booking){
  const fixed=booking.commissionAmount;
  const percent=booking.commissionPercent;
  const total=Number(booking.total);

  // Reprend la règle de calcul de l'application.
  if(fixed!==null&&fixed!==undefined&&fixed!==''&&Number.isFinite(Number(fixed))){
    return Math.max(0,Number(fixed));
  }

  if(percent!==null&&percent!==undefined&&percent!==''&&Number.isFinite(Number(percent))&&Number.isFinite(total)){
    return Math.max(0,Math.round(total*Number(percent))/100);
  }

  return 0;
}

const STATUS_LABELS={
  indisponible:'Indisponible',
  option:'Option',
  arrhes:'Arrhes payées',
  paye:'Payé',
  annulation:'Annulation'
};

function statusLabel(key){
  const k=String(key||'').toLowerCase();
  return STATUS_LABELS[k]||(key?String(key):'Non renseigné');
}

function isFinancial(booking){
  return ['arrhes','paye'].includes(String(booking.status||'').toLowerCase());
}

function hasTotal(booking){
  return booking.total!==null&&booking.total!==undefined&&booking.total!==''&&Number.isFinite(Number(booking.total));
}

function makeKpi(parent,label,value,note){
  const card=document.createElement('div');
  card.className='kpi';
  addText(card,'div',label,'kpi-label');
  addText(card,'div',value,'kpi-value');
  if(note)addText(card,'div',note,'kpi-note');
  parent.appendChild(card);
}

function getYearBookings(apartment,year){
  const start=Date.UTC(year,0,1);
  const end=Date.UTC(year+1,0,1);
  return (apartment.bookings||[]).filter(b=>{
    const ci=dateValue(b.checkin);
    const co=dateValue(b.checkout);
    return Number.isFinite(ci)&&Number.isFinite(co)&&ci<end&&co>start;
  });
}

function overlapNights(booking,year,month){
  const stayStart=dateValue(booking.checkin);
  const stayEnd=dateValue(booking.checkout);
  if(!Number.isFinite(stayStart)||!Number.isFinite(stayEnd))return 0;

  const periodStart=month===null?Date.UTC(year,0,1):Date.UTC(year,month,1);
  const periodEnd=month===null?Date.UTC(year+1,0,1):Date.UTC(year,month+1,1);
  const start=Math.max(stayStart,periodStart);
  const end=Math.min(stayEnd,periodEnd);
  return Math.max(0,Math.round((end-start)/86400000));
}

function bookingFinancialValues(booking){
  const total=hasTotal(booking)?Number(booking.total):null;
  const commission=getCommission(booking);
  return {
    total,
    commission,
    net:total===null?null:total-commission
  };
}

function calculatePeriod(bookings,year,month){
  let revenue=0;
  let commission=0;
  let net=0;
  let nights=0;
  let pricedNights=0;
  let count=0;
  let incomplete=0;

  bookings.forEach(b=>{
    if(!isFinancial(b))return;

    const overlap=overlapNights(b,year,month);
    if(overlap<=0)return;

    const totalNights=getNights(b)||1;
    const values=bookingFinancialValues(b);

    nights+=overlap;
    if(values.total===null){
      incomplete++;
      return;
    }

    pricedNights+=overlap;
    const ratio=overlap/totalNights;
    revenue+=values.total*ratio;
    commission+=values.commission*ratio;
    net+=values.net*ratio;

    // Une réservation est comptée dans son mois d'arrivée,
    // ou en janvier si elle a commencé avant l'année sélectionnée.
    const arrival=new Date(dateValue(b.checkin));
    const arrivalYear=arrival.getUTCFullYear();
    const arrivalMonth=arrivalYear<year?0:arrival.getUTCMonth();
    if(month===null||month===arrivalMonth)count++;
  });

  return {revenue,commission,net,nights,pricedNights,count,incomplete};
}

function renderGlobalSummary(apartments,year){
  const all=[];
  apartments.forEach(a=>{
    getYearBookings(a,year).forEach(b=>all.push(b));
  });

  const totals=calculatePeriod(all,year,null);
  const confirmed=all.filter(isFinancial).length;

  const kpis=document.createElement('div');
  kpis.className='kpis';

  makeKpi(kpis,'Revenu locatif brut',money(totals.revenue),'Réservations avec arrhes ou payées');
  makeKpi(kpis,'Commission conciergerie',money(totals.commission),'Calculée réservation par réservation');
  makeKpi(kpis,'Revenu propriétaire',money(totals.net),'Après déduction des commissions');
  makeKpi(kpis,'Nuitées confirmées',String(totals.nights),'Sur la période sélectionnée');

  dashboard.appendChild(kpis);

  const info=document.createElement('div');
  info.className='small';
  info.style.margin='-5px 0 20px';
  info.textContent=confirmed+' réservation(s) avec arrhes ou payées sur la période.';
  dashboard.appendChild(info);

  if(totals.incomplete){
    const warning=document.createElement('div');
    warning.className='warning';
    warning.textContent=totals.incomplete+' réservation(s) confirmée(s) n’ont pas de montant total renseigné. Elles sont exclues des totaux financiers pour éviter un calcul incorrect.';
    dashboard.appendChild(warning);
  }
}

function renderMonthlyPanel(parent,bookings,year){
  const panel=document.createElement('section');
  panel.className='panel';
  addText(panel,'h3','Bilan financier mois par mois');

  const monthly=months.map((name,index)=>({
    name,
    ...calculatePeriod(bookings,year,index)
  }));

  const maxValue=Math.max(1,...monthly.map(m=>m.revenue));
  const wrap=document.createElement('div');
  wrap.className='table-wrap';
  const table=document.createElement('table');
  const thead=document.createElement('thead');
  const head=document.createElement('tr');

  ['Mois','Réservations','Nuitées','Revenu brut','Commission','Net propriétaire'].forEach((label,i)=>{
    addText(head,'th',label,i===0?'':'num');
  });
  thead.appendChild(head);
  table.appendChild(thead);

  const tbody=document.createElement('tbody');
  monthly.forEach(m=>{
    const row=document.createElement('tr');
    const nameCell=document.createElement('td');
    addText(nameCell,'div',m.name,'month-name');
    const bar=document.createElement('div');
    bar.className='month-bar';
    const fill=document.createElement('span');
    fill.style.width=(m.revenue/maxValue*100)+'%';
    bar.appendChild(fill);
    nameCell.appendChild(bar);
    row.appendChild(nameCell);

    addText(row,'td',String(m.count),'num');
    addText(row,'td',String(m.nights),'num');
    addText(row,'td',money(m.revenue),'num');
    addText(row,'td',money(m.commission),'num');
    addText(row,'td',money(m.net),'num');
    tbody.appendChild(row);
  });

  const totals=calculatePeriod(bookings,year,null);
  const totalRow=document.createElement('tr');
  totalRow.className='total-row';
  addText(totalRow,'td','TOTAL');
  addText(totalRow,'td',String(totals.count),'num');
  addText(totalRow,'td',String(totals.nights),'num');
  addText(totalRow,'td',money(totals.revenue),'num');
  addText(totalRow,'td',money(totals.commission),'num');
  addText(totalRow,'td',money(totals.net),'num');
  tbody.appendChild(totalRow);

  table.appendChild(tbody);
  wrap.appendChild(table);
  panel.appendChild(wrap);
  parent.appendChild(panel);
}

function commissionLabel(booking){
  if(booking.commissionAmount!==null&&booking.commissionAmount!==undefined&&booking.commissionAmount!==''){
    return 'Forfait en euros';
  }
  if(booking.commissionPercent!==null&&booking.commissionPercent!==undefined&&booking.commissionPercent!==''){
    return Number(booking.commissionPercent).toLocaleString('fr-FR')+' %';
  }
  return 'Non renseignée';
}

function renderBookingDetails(parent,bookings,year){
  addText(parent,'h2','Détail des réservations','section-title');

  if(!bookings.length){
    addText(parent,'div','Aucune réservation sur cette période.','empty');
    return;
  }

  const groups=months.map((name,index)=>({
    name,
    index,
    bookings:bookings.filter(b=>{
      const arrival=new Date(dateValue(b.checkin));
      if(!Number.isFinite(arrival.getTime()))return false;
      const month=arrival.getUTCFullYear()<year?0:arrival.getUTCMonth();
      return month===index;
    })
  }));

  groups.forEach(group=>{
    if(!group.bookings.length)return;

    const details=document.createElement('details');
    const summary=document.createElement('summary');
    const left=document.createElement('div');

    addText(left,'div',group.name,'summary-title');
    addText(left,'div',group.bookings.length+' réservation(s)','summary-sub');
    summary.appendChild(left);
    details.appendChild(summary);

    const list=document.createElement('div');
    list.className='booking-list';

    group.bookings.sort((a,b)=>String(a.checkin).localeCompare(String(b.checkin)));

    group.bookings.forEach(booking=>{
      const values=bookingFinancialValues(booking);
      const item=document.createElement('div');
      item.className='booking';

      const dates=document.createElement('div');
      addText(dates,'div','Arrivée / Départ','booking-label');
      addText(dates,'div',formatDate(booking.checkin)+' – '+formatDate(booking.checkout),'booking-value');
      item.appendChild(dates);

      const status=document.createElement('div');
      addText(status,'div','Statut','booking-label');
      addText(status,'span',statusLabel(booking.status),'status');
      item.appendChild(status);

      const commission=document.createElement('div');
      addText(commission,'div','Commission ('+commissionLabel(booking)+')','booking-label');
      addText(commission,'div',values.total===null?'—':money(values.commission),'booking-value');
      item.appendChild(commission);

      const amount=document.createElement('div');
      addText(amount,'div','Revenu propriétaire','booking-label');
      addText(amount,'div',values.net===null?'À compléter':money(values.net),'booking-net booking-total');
      item.appendChild(amount);

      const extra=document.createElement('div');
      extra.style.gridColumn='1/-1';
      extra.className='small';
      const guests=Number(booking.adults||0)+Number(booking.children||0);
      extra.textContent='Voyageurs : '+guests+' · Montant réservation : '+(values.total===null?'Non renseigné':money(values.total));
      list.appendChild(item);
      item.appendChild(extra);
    });

    details.appendChild(list);
    parent.appendChild(details);
  });
}


const MONTHS_SHORT=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
const COL={net:'#54896D',com:'#C39A61',pending:'#E2C48F'};

function svgEl(parent,tag,attrs,text){
  const el=document.createElementNS('http://www.w3.org/2000/svg',tag);
  Object.keys(attrs||{}).forEach(k=>el.setAttribute(k,attrs[k]));
  if(text!=null)el.textContent=text;
  parent.appendChild(el);
  return el;
}

function shortMoney(v){
  if(v>=1000)return (v/1000).toLocaleString('fr-FR',{maximumFractionDigits:2})+' k€';
  return Math.round(v)+' €';
}

function niceStep(raw){
  if(!(raw>0))return 25;
  const p=Math.pow(10,Math.floor(Math.log10(raw)));
  const n=raw/p;
  return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;
}

function makeLegend(parent,items){
  const box=document.createElement('div');
  box.className='legend';
  items.forEach(item=>{
    const span=document.createElement('span');
    const dot=document.createElement('i');
    dot.style.background=item[0];
    span.appendChild(dot);
    span.appendChild(document.createTextNode(item[1]));
    box.appendChild(span);
  });
  parent.appendChild(box);
}

function renderMonthlyChart(parent,monthly){
  const panel=document.createElement('section');
  panel.className='panel';
  addText(panel,'h3','Vos revenus mois par mois');

  const W=640,H=270,L=48,R=8,T=18,B=28;
  const plotW=W-L-R,plotH=H-T-B;
  const max=Math.max(0,...monthly.map(m=>m.revenue));
  const step=niceStep(max/4);
  const ticks=Math.max(1,Math.ceil(max/step));
  const top=step*ticks;
  const svg=svgEl(panel,'svg',{viewBox:'0 0 '+W+' '+H,class:'chart-svg',role:'img','aria-label':'Revenus par mois'});

  for(let i=0;i<=ticks;i++){
    const y=T+plotH-plotH*i/ticks;
    svgEl(svg,'line',{x1:L,x2:W-R,y1:y,y2:y,stroke:i?'#E6ECE8':'#CBD6CF','stroke-width':1});
    svgEl(svg,'text',{x:L-6,y:y+4,'text-anchor':'end'},shortMoney(step*i));
  }

  const slot=plotW/12,bw=slot*0.62;
  let best=0;
  monthly.forEach((m,i)=>{if(m.revenue>monthly[best].revenue)best=i;});

  monthly.forEach((m,i)=>{
    const x=L+slot*i+(slot-bw)/2;
    const hNet=plotH*Math.max(0,m.net)/top;
    const hCom=plotH*Math.max(0,m.commission)/top;
    const g=svgEl(svg,'g',{});
    svgEl(g,'title',{},m.name+' : '+money(m.revenue)+' bruts, dont '+money(m.net)+' pour vous');
    if(hNet>0)svgEl(g,'rect',{x:x,y:T+plotH-hNet,width:bw,height:hNet,rx:3,fill:COL.net});
    if(hCom>0)svgEl(g,'rect',{x:x,y:T+plotH-hNet-hCom,width:bw,height:hCom,rx:3,fill:COL.com});
    if(i===best&&m.revenue>0){
      svgEl(g,'text',{x:x+bw/2,y:T+plotH-hNet-hCom-6,'text-anchor':'middle',class:'best'},shortMoney(m.revenue));
    }
    svgEl(g,'text',{x:x+bw/2,y:H-9,'text-anchor':'middle'},MONTHS_SHORT[i]);
  });

  makeLegend(panel,[[COL.net,'Votre revenu'],[COL.com,'Commission conciergerie']]);
  parent.appendChild(panel);
}

function renderDonut(parent,totals){
  const panel=document.createElement('section');
  panel.className='panel';
  addText(panel,'h3','Répartition du revenu brut');

  const r=62,c=2*Math.PI*r;
  const pct=totals.revenue>0?totals.net/totals.revenue:0;
  const svg=svgEl(panel,'svg',{viewBox:'0 0 170 170',class:'chart-svg donut-svg',role:'img','aria-label':'Part propriétaire et commission'});
  svgEl(svg,'circle',{cx:85,cy:85,r:r,fill:'none',stroke:'#EDF1EE','stroke-width':22});

  if(totals.revenue>0){
    const netLen=c*pct;
    svgEl(svg,'circle',{cx:85,cy:85,r:r,fill:'none',stroke:COL.net,'stroke-width':22,
      'stroke-dasharray':netLen+' '+(c-netLen),transform:'rotate(-90 85 85)'});
    if(c-netLen>0.5){
      svgEl(svg,'circle',{cx:85,cy:85,r:r,fill:'none',stroke:COL.com,'stroke-width':22,
        'stroke-dasharray':(c-netLen)+' '+netLen,'stroke-dashoffset':-netLen,transform:'rotate(-90 85 85)'});
    }
  }
  svgEl(svg,'text',{x:85,y:90,'text-anchor':'middle',class:'donut-big'},totals.revenue>0?Math.round(pct*100)+' %':'—');
  svgEl(svg,'text',{x:85,y:108,'text-anchor':'middle',class:'donut-sub'},'pour vous');

  const rows=[[COL.net,'Votre revenu',totals.net],[COL.com,'Commission',totals.commission]];
  const list=document.createElement('div');
  list.style.marginTop='12px';
  rows.forEach(row=>{
    const line=document.createElement('div');
    line.className='split';
    const label=document.createElement('span');
    const dot=document.createElement('i');
    dot.style.background=row[0];
    label.appendChild(dot);
    label.appendChild(document.createTextNode(row[1]));
    line.appendChild(label);
    addText(line,'b',money(row[2]));
    list.appendChild(line);
  });
  panel.appendChild(list);
  parent.appendChild(panel);
}

function renderVisuals(apartments,year){
  const all=[];
  apartments.forEach(a=>getYearBookings(a,year).forEach(b=>all.push(b)));
  const monthly=months.map((name,i)=>Object.assign({name:name},calculatePeriod(all,year,i)));
  const totals=calculatePeriod(all,year,null);

  const grid=document.createElement('div');
  grid.className='viz-grid';
  renderMonthlyChart(grid,monthly);
  renderDonut(grid,totals);
  dashboard.appendChild(grid);
}

function occupancyState(apartment,year){
  const state=months.map((_,m)=>new Array(new Date(Date.UTC(year,m+1,0)).getUTCDate()).fill(0));
  (apartment.bookings||[]).forEach(b=>{
    if(String(b.status||'').toLowerCase().indexOf('annul')>=0)return;
    const ci=dateValue(b.checkin),co=dateValue(b.checkout);
    if(!Number.isFinite(ci)||!Number.isFinite(co))return;
    const val=isFinancial(b)?2:1;
    for(let t=ci;t<co;t+=86400000){
      const d=new Date(t);
      if(d.getUTCFullYear()!==year)continue;
      const arr=state[d.getUTCMonth()];
      arr[d.getUTCDate()-1]=Math.max(arr[d.getUTCDate()-1],val);
    }
  });
  return state;
}

function renderApartmentVisuals(parent,apartment,year,bookings){
  const state=occupancyState(apartment,year);
  const booked=state.reduce((sum,arr)=>sum+arr.filter(v=>v===2).length,0);
  const daysInYear=state.reduce((sum,arr)=>sum+arr.length,0);
  const occ=Math.round(booked/daysInYear*100);
  const totals=calculatePeriod(bookings,year,null);

  const now=new Date();
  const today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  const upcoming=(apartment.bookings||[])
    .filter(b=>b.checkin&&b.checkin>=today&&['option','arrhes','paye'].includes(String(b.status||'').toLowerCase()))
    .sort((a,b)=>String(a.checkin).localeCompare(String(b.checkin)))[0];

  const chips=document.createElement('div');
  chips.className='chips';

  const c1=document.createElement('div');c1.className='chip';
  addText(c1,'div','Taux d’occupation','chip-label');
  addText(c1,'div',occ+' %','chip-value');
  const meter=document.createElement('div');meter.className='meter';
  const fill=document.createElement('span');fill.style.width=Math.min(100,occ)+'%';
  meter.appendChild(fill);c1.appendChild(meter);
  chips.appendChild(c1);

  const c2=document.createElement('div');c2.className='chip';
  addText(c2,'div','Revenu moyen par nuit','chip-label');
  addText(c2,'div',totals.pricedNights>0?money(totals.net/totals.pricedNights):'—','chip-value');
  chips.appendChild(c2);

  const c3=document.createElement('div');c3.className='chip';
  addText(c3,'div','Prochaine arrivée','chip-label');
  addText(c3,'div',upcoming?formatDate(upcoming.checkin):'—','chip-value');
  chips.appendChild(c3);
  parent.appendChild(chips);

  const panel=document.createElement('section');
  panel.className='panel';
  addText(panel,'h3','Calendrier d’occupation '+year);
  const wrap=document.createElement('div');
  wrap.className='heat-wrap';
  const heat=document.createElement('div');
  heat.className='heat';

  addText(heat,'div','','heat-label');
  for(let d=1;d<=31;d++)addText(heat,'div',(d===1||d%5===0)?d:'','heat-day');
  addText(heat,'div','','heat-label');

  state.forEach((arr,m)=>{
    addText(heat,'div',MONTHS_SHORT[m],'heat-label');
    for(let d=0;d<31;d++){
      const cell=document.createElement('div');
      if(d>=arr.length){cell.className='heat-cell none';}
      else{
        cell.className='heat-cell'+(arr[d]===2?' on':arr[d]===1?' opt':'');
        cell.title=(d+1)+' '+months[m].toLowerCase()+' : '+(arr[d]===2?'réservé':arr[d]===1?'en attente':'libre');
      }
      heat.appendChild(cell);
    }
    const monthBooked=arr.filter(v=>v===2).length;
    addText(heat,'div',Math.round(monthBooked/arr.length*100)+' %','heat-pct');
  });

  wrap.appendChild(heat);
  panel.appendChild(wrap);
  makeLegend(panel,[[COL.net,'Réservé (arrhes ou payé)'],[COL.pending,'En attente'],['#EDF1EE','Libre']]);
  parent.appendChild(panel);
}

function renderDashboard(apartments,year){
  dashboard.replaceChildren();

  const title=document.createElement('section');
  title.className='intro';
  addText(title,'h2','Votre bilan annuel');
  addText(title,'p','Synthèse de vos logements pour '+year,'address');
  dashboard.appendChild(title);

  renderGlobalSummary(apartments,year);
  renderVisuals(apartments,year);

  apartments.forEach(apartment=>{
    const bookings=getYearBookings(apartment,year);
    const section=document.createElement('section');
    section.className='intro';
    addText(section,'h2',apartment.name||'Votre logement');
    if(apartment.propertyType){
      addText(section,'p',apartment.propertyType,'address');
    }
    if(apartment.propertyAddress){
      addText(section,'p',apartment.propertyAddress,'address');
    }
    dashboard.appendChild(section);

    renderApartmentVisuals(dashboard,apartment,year,bookings);
    renderMonthlyPanel(dashboard,bookings,year);
    renderBookingDetails(dashboard,bookings,year);
  });

  const note=document.createElement('p');
  note.className='small';
  note.style.marginTop='20px';
  note.textContent='Les totaux financiers prennent en compte uniquement les réservations avec arrhes ou payées. Les montants et commissions des séjours chevauchant plusieurs mois ou années sont répartis selon le nombre de nuitées.';
  dashboard.appendChild(note);
}

async function loadOwner(){
  if(!token){
    message.hidden=false;
    message.textContent='Lien incomplet. Demandez un nouveau lien à votre gestionnaire.';
    dashboard.replaceChildren();
    return;
  }

  message.hidden=false;
  message.textContent='Chargement de votre espace…';
  dashboard.replaceChildren();

  try{
    const response=await fetch(
      SUPABASE_URL+'/rest/v1/rpc/owner_portal_get',
      {
        method:'POST',
        headers:{
          'apikey':SUPABASE_KEY,
          'Content-Type':'application/json'
        },
        body:JSON.stringify({
          target_token:token,
          target_year:Number(yearSelect.value)
        })
      }
    );

    const result=await response.json();

    if(!response.ok){
      throw new Error(result.message||result.details||'Lien invalide ou expiré.');
    }

    if(!result.apartments||!result.apartments.length){
      throw new Error('Aucun logement associé à ce lien.');
    }

    result.apartments.forEach(a=>{
      a.bookings=(a.bookings||[]).filter(b=>String(b.status||'').toLowerCase()!=='nemeconcerne');
    });

    message.hidden=true;
    renderDashboard(result.apartments,Number(yearSelect.value));

  }catch(error){
    message.hidden=false;
    message.textContent=error.message||'Impossible de charger votre espace.';
    dashboard.replaceChildren();
  }
}

yearSelect.addEventListener('change',loadOwner);
document.getElementById('printBtn').addEventListener('click',()=>window.print());
loadOwner();
</script>
